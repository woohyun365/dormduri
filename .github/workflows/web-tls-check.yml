name: Web TLS check

# 공개 host 인증서의 남은 기간을 매일 본다(D-WB6). 21일 미만이거나 apex·www를 함께 담지 않으면 실패해 Owner에게 알린다.
# 공개 저장소 예약 workflow는 60일 동안 저장소 활동이 없으면 꺼지므로 Route 53 health check와 이중으로 둔다.
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the public certificate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Check the remaining validity
        run: node scripts/infra/user-host/tls-check.mjs
