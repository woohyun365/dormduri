name: Web CI

on:
  workflow_call:
    inputs:
      run_storybook:
        description: Build the Storybook surface for Storybook-owned changes.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web-core:
    name: Web static/build/browser gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_APP_URL: https://ci.knu-roommate.invalid
      NEXT_PUBLIC_SENTRY_ENABLED: '0'
      NEXT_PUBLIC_SENTRY_PRIVACY_APPROVED: '0'
      NEXT_PUBLIC_SENTRY_RELEASE_EVIDENCE_APPROVED: '0'
      SENTRY_SOURCE_MAP_UPLOAD_ENABLED: '0'
      SENTRY_RELEASE_EVIDENCE_APPROVED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start CI timing
        id: timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next build cache
        id: next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/package.json', 'apps/web/next.config.*', 'apps/web/tsconfig*.json', 'packages/shared/package.json', 'packages/tsconfig/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-next-

      - name: Install dependencies
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=install -- pnpm install --frozen-lockfile

      - name: Restore Web TypeScript build info
        id: web-tsc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/*.tsbuildinfo
          key: ${{ runner.os }}-${{ runner.arch }}-web-tsc-${{ hashFiles('pnpm-lock.yaml', 'packages/tsconfig/**', 'apps/web/tsconfig*.json') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/web/e2e/**/*.ts', 'apps/web/.storybook/**/*.ts', 'apps/web/.storybook/**/*.tsx', 'apps/web/*.ts', 'packages/shared/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-web-tsc-${{ hashFiles('pnpm-lock.yaml', 'packages/tsconfig/**', 'apps/web/tsconfig*.json') }}-

      - name: Prepare Web dependencies
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=prepare -- pnpm web:prepare

      - name: Web static checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=static -- sh -c 'pnpm web:lint:prepared && pnpm web:typecheck:prepared'

      - name: Save Web TypeScript build info
        if: ${{ steps.web-tsc-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/*.tsbuildinfo
          key: ${{ steps.web-tsc-cache.outputs.cache-primary-key }}

      - name: Web production build
        env:
          SENTRY_AUTH_TOKEN: sentry-ci-secret-must-not-ship
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=build -- pnpm web:build:prepared

      - name: Verify account-free Sentry artifact boundary
        env:
          SENTRY_ARTIFACT_SECRET_SENTINEL: sentry-ci-secret-must-not-ship
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=sentry-artifact -- pnpm web:sentry:verify-build

      - name: Build Storybook surface
        if: ${{ inputs.run_storybook }}
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=storybook -- pnpm --dir apps/web ci:storybook:build

      - name: Install Playwright Chromium
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=browser-install -- pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Check new Storybook stories
        if: ${{ inputs.run_storybook }}
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=storybook-visual -- pnpm --dir apps/web ci:storybook:visual

      - name: Web browser smoke with prebuilt standalone artifact
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web --stage=browser -- pnpm web:e2e:prepared

      - name: Upload Playwright report
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize Web CI duration
        if: ${{ always() && !cancelled() }}
        env:
          STARTED_AT: ${{ steps.timing.outputs.started_at }}
        run: |
          duration_seconds=$(($(date +%s) - STARTED_AT))
          echo "### Web CI timing" >> "$GITHUB_STEP_SUMMARY"
          echo "- total_duration_seconds: ${duration_seconds}" >> "$GITHUB_STEP_SUMMARY"
          echo "- next_build_cache_hit: ${{ steps.next-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- pnpm_store_cache: setup-node managed; install timing is the observable signal" >> "$GITHUB_STEP_SUMMARY"
          echo "- storybook_build: ${{ inputs.run_storybook }}" >> "$GITHUB_STEP_SUMMARY"

  web-unit:
    name: Web unit gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://ci.knu-roommate.invalid
      NEXT_PUBLIC_SENTRY_ENABLED: '0'
      NEXT_PUBLIC_SENTRY_PRIVACY_APPROVED: '0'
      NEXT_PUBLIC_SENTRY_RELEASE_EVIDENCE_APPROVED: '0'
      SENTRY_SOURCE_MAP_UPLOAD_ENABLED: '0'
      SENTRY_RELEASE_EVIDENCE_APPROVED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start CI timing
        id: timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web-unit --stage=install -- pnpm install --frozen-lockfile

      - name: Prepare Web dependencies
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web-unit --stage=prepare -- pnpm web:prepare

      - name: Web unit tests
        run: node scripts/ci/lanes/run-timed-command.mjs --scope=Web-unit --stage=unit -- pnpm web:test:prepared

      - name: Summarize Web unit duration
        if: ${{ always() && !cancelled() }}
        env:
          STARTED_AT: ${{ steps.timing.outputs.started_at }}
        run: |
          duration_seconds=$(($(date +%s) - STARTED_AT))
          echo "### Web unit timing" >> "$GITHUB_STEP_SUMMARY"
          echo "- total_duration_seconds: ${duration_seconds}" >> "$GITHUB_STEP_SUMMARY"
          echo "- pnpm_store_cache: setup-node managed; install timing is the observable signal" >> "$GITHUB_STEP_SUMMARY"
