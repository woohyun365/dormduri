name: Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed surfaces
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      web: ${{ steps.changes.outputs.web }}
      api: ${{ steps.changes.outputs.api }}
      shared: ${{ steps.changes.outputs.shared }}
      storybook: ${{ steps.changes.outputs.storybook }}
      infra: ${{ steps.changes.outputs.infra }}
      repo_policy: ${{ steps.changes.outputs.repoPolicy }}
      agent_workflow: ${{ steps.changes.outputs.agentWorkflow }}
      classification_failed: ${{ steps.changes.outputs.classification_failed }}
      formatting_scope: ${{ steps.changes.outputs.formatting_scope }}
      formatting_paths: ${{ steps.changes.outputs.formatting_paths_json }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Classify changes
        id: changes
        run: node scripts/ci/lanes/classify-changes.mjs

      - name: Summarize classification
        env:
          CHANGED_PATHS: ${{ steps.changes.outputs.changed_paths_json }}
          CHANGED_PATH_COUNT: ${{ steps.changes.outputs.changed_path_count }}
          CHANGED_PATHS_TRUNCATED: ${{ steps.changes.outputs.changed_paths_truncated }}
          COMPARISON_BASE: ${{ steps.changes.outputs.comparison_base }}
          COMPARISON_HEAD: ${{ steps.changes.outputs.comparison_head }}
          COMPARISON_STRATEGY: ${{ steps.changes.outputs.comparison_strategy }}
          CLASSIFICATION_FAILED: ${{ steps.changes.outputs.classification_failed }}
          FORMATTING_SCOPE: ${{ steps.changes.outputs.formatting_scope }}
        run: |
          echo "### Change classification" >> "$GITHUB_STEP_SUMMARY"
          echo "- comparison: ${COMPARISON_BASE}..${COMPARISON_HEAD} (${COMPARISON_STRATEGY})" >> "$GITHUB_STEP_SUMMARY"
          echo "- fallback_to_all_lanes: ${CLASSIFICATION_FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- formatting_scope: ${FORMATTING_SCOPE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- changed_path_count: ${CHANGED_PATH_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- changed_paths_sample_truncated: ${CHANGED_PATHS_TRUNCATED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- changed_paths_sample: \`${CHANGED_PATHS}\`" >> "$GITHUB_STEP_SUMMARY"

  shared:
    name: Shared contract gate
    needs: classify
    if: ${{ needs.classify.outputs.shared == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared package once
        run: pnpm shared:build

      - name: Verify Shared contract and public surface
        run: pnpm shared:lint && pnpm shared:typecheck && pnpm shared:typecheck:test && pnpm shared:test:prepared

  api:
    name: API validation
    needs: classify
    if: ${{ needs.classify.outputs.api == 'true' }}
    uses: ./.github/workflows/api-ci.yml

  web:
    name: Web validation
    needs: classify
    if: ${{ needs.classify.outputs.web == 'true' }}
    uses: ./.github/workflows/web-ci.yml
    with:
      run_storybook: ${{ needs.classify.outputs.storybook == 'true' }}

  infra:
    name: Infrastructure validation
    needs: classify
    if: ${{ needs.classify.outputs.infra == 'true' }}
    uses: ./.github/workflows/infra-ci.yml

  repo_policy:
    name: Repository policy gate
    needs: classify
    if: ${{ needs.classify.outputs.repo_policy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        timeout-minutes: 10
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository policy scripts
        run: node scripts/ci/lanes/run-repo-policy.mjs --suite repo-policy

      - name: Verify repository formatting
        env:
          FORMATTING_SCOPE: ${{ needs.classify.outputs.formatting_scope }}
          FORMATTING_PATHS: ${{ needs.classify.outputs.formatting_paths }}
        run: node scripts/ci/lanes/check-formatting.mjs

  agent_workflow:
    name: Agent workflow gate
    needs: classify
    if: ${{ needs.classify.outputs.agent_workflow == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The agent workflow suite imports no installed package, so this job installs no dependencies.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify agent workflow scripts
        run: node scripts/ci/lanes/run-repo-policy.mjs --suite agent-workflow

  # Runs on every pull request regardless of classification. The PR body is read through the API at run time, so
  # re-running this failed job after a body edit checks the edited body; it is never interpolated into a step.
  lifecycle_gate:
    name: Lifecycle gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The lifecycle gate imports no installed package, so this job installs no dependencies.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check lifecycle policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/lifecycle/run.mjs

  ci-summary:
    name: CI summary
    needs:
      - classify
      - shared
      - api
      - web
      - infra
      - repo_policy
      - agent_workflow
      - lifecycle_gate
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every selected lane to succeed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SHARED_SELECTED: ${{ needs.classify.outputs.shared }}
          SHARED_RESULT: ${{ needs.shared.result }}
          API_SELECTED: ${{ needs.classify.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          WEB_SELECTED: ${{ needs.classify.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          INFRA_SELECTED: ${{ needs.classify.outputs.infra }}
          INFRA_RESULT: ${{ needs.infra.result }}
          REPO_POLICY_SELECTED: ${{ needs.classify.outputs.repo_policy }}
          REPO_POLICY_RESULT: ${{ needs.repo_policy.result }}
          AGENT_WORKFLOW_SELECTED: ${{ needs.classify.outputs.agent_workflow }}
          AGENT_WORKFLOW_RESULT: ${{ needs.agent_workflow.result }}
          # Selected by the job's own event condition, not by classification.
          LIFECYCLE_GATE_SELECTED: ${{ github.event_name == 'pull_request' }}
          LIFECYCLE_GATE_RESULT: ${{ needs.lifecycle_gate.result }}
          CLASSIFICATION_FAILED: ${{ needs.classify.outputs.classification_failed }}
        run: |
          failed=0

          require_selected_lane() {
            name="$1"
            selected="$2"
            result="$3"

            if [ "$selected" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::${name} was selected but finished with ${result}."
              failed=1
            fi

            if [ "$selected" != "true" ] && [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "::error::${name} was not selected but finished with ${result}."
              failed=1
            fi
          }

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::Change classification failed before safe fallback outputs were produced."
            failed=1
          fi

          require_selected_lane "shared" "$SHARED_SELECTED" "$SHARED_RESULT"
          require_selected_lane "api" "$API_SELECTED" "$API_RESULT"
          require_selected_lane "web" "$WEB_SELECTED" "$WEB_RESULT"
          require_selected_lane "infra" "$INFRA_SELECTED" "$INFRA_RESULT"
          require_selected_lane "repo-policy" "$REPO_POLICY_SELECTED" "$REPO_POLICY_RESULT"
          require_selected_lane "agent-workflow" "$AGENT_WORKFLOW_SELECTED" "$AGENT_WORKFLOW_RESULT"
          require_selected_lane "lifecycle-gate" "$LIFECYCLE_GATE_SELECTED" "$LIFECYCLE_GATE_RESULT"

          {
            echo "### Monorepo CI summary"
            echo "| lane | selected | result |"
            echo "| --- | --- | --- |"
            echo "| classify | true | ${CLASSIFY_RESULT} |"
            echo "| shared | ${SHARED_SELECTED} | ${SHARED_RESULT} |"
            echo "| api | ${API_SELECTED} | ${API_RESULT} |"
            echo "| web | ${WEB_SELECTED} | ${WEB_RESULT} |"
            echo "| infra | ${INFRA_SELECTED} | ${INFRA_RESULT} |"
            echo "| repo-policy | ${REPO_POLICY_SELECTED} | ${REPO_POLICY_RESULT} |"
            echo "| agent-workflow | ${AGENT_WORKFLOW_SELECTED} | ${AGENT_WORKFLOW_RESULT} |"
            echo "| lifecycle-gate | ${LIFECYCLE_GATE_SELECTED} | ${LIFECYCLE_GATE_RESULT} |"
            echo "| classifier fail-open | ${CLASSIFICATION_FAILED} | n/a |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"
