name: Infrastructure CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Infrastructure static gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize runner-owned artifact path
        run: echo "KNU_ARTIFACTS_DIR=$RUNNER_TEMP/knu-roommate-artifacts" >> "$GITHUB_ENV"

      - name: Capture secret-free infrastructure inventory
        run: |
          mkdir -p "$KNU_ARTIFACTS_DIR/infra"
          pnpm infra:inspect > "$KNU_ARTIFACTS_DIR/infra/inspection.json"

      - name: Run canonical static infrastructure gate
        run: pnpm infra:check:static

      - name: Upload static infrastructure evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-static-evidence
          path: |
            ${{ runner.temp }}/knu-roommate-artifacts/infra/inspection.json
            ${{ runner.temp }}/knu-roommate-artifacts/infra/observability-production.json
          if-no-files-found: error
          retention-days: 7

  runtime-config:
    name: Infrastructure container config gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Initialize runner-owned artifact path
        run: echo "KNU_ARTIFACTS_DIR=$RUNNER_TEMP/knu-roommate-artifacts" >> "$GITHUB_ENV"

      - name: Validate nginx and observability runtime configs
        run: pnpm infra:check:runtime

      - name: Upload runtime configuration evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-runtime-config-evidence
          path: ${{ runner.temp }}/knu-roommate-artifacts/infra/runtime-configs.json
          if-no-files-found: error
          retention-days: 7
