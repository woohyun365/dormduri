name: API CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API build/test gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://knu_dev:knu_dev_password@localhost:5432/knu_roommate?schema=public
      DIRECT_URL: postgresql://knu_dev:knu_dev_password@localhost:5432/knu_roommate?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: knu_dev
          POSTGRES_PASSWORD: knu_dev_password
          POSTGRES_DB: knu_roommate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knu_dev -d knu_roommate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start CI timing
        id: timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=install -- pnpm install --frozen-lockfile

      - name: Prepare API dependencies
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=prepare -- pnpm api:prepare

      - name: API static checks
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=static -- pnpm api:check:prepared

      - name: API unit tests
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=unit -- pnpm api:test:prepared

      - name: API integration tests
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=integration-db -- pnpm api:test:integration:prepared

      - name: API E2E tests
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=e2e-db -- pnpm api:test:e2e:prepared

      - name: API stress harness tests
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=stress-harness -- pnpm api:test:stress:prepared

      - name: API production build
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=build -- pnpm api:build:prepared

      - name: Validate API deploy compose
        run: node scripts/ci/run-timed-command.mjs --scope=API --stage=compose -- sh -c 'docker compose -f infra/deploy/docker-compose.api.yml config >/tmp/knu-api-compose.yml'

      - name: Summarize API CI duration
        if: ${{ always() && !cancelled() }}
        env:
          STARTED_AT: ${{ steps.timing.outputs.started_at }}
        run: |
          duration_seconds=$(($(date +%s) - STARTED_AT))
          echo "- total_duration_seconds: ${duration_seconds}" >> "$GITHUB_STEP_SUMMARY"
          echo "- pnpm_store_cache: setup-node managed; install timing is the observable signal" >> "$GITHUB_STEP_SUMMARY"
