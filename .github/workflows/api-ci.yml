name: API CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build/test gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://knu_dev:knu_dev_password@localhost:5432/knu_roommate?schema=public
      DIRECT_URL: postgresql://knu_dev:knu_dev_password@localhost:5432/knu_roommate?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: knu_dev
          POSTGRES_PASSWORD: knu_dev_password
          POSTGRES_DB: knu_roommate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knu_dev -d knu_roommate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.3 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Prepare CI database schema
        run: pnpm --dir apps/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Generate Prisma artifacts
        run: pnpm api:prisma:generate

      - name: API static checks
        run: pnpm check:api

      - name: API tests
        run: pnpm test:api

      - name: API production build
        run: pnpm build:api

      - name: Validate API deploy compose
        run: docker compose -f infra/deploy/docker-compose.api.yml config >/tmp/knu-api-compose.yml
