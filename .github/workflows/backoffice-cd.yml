name: Backoffice CD

# 백오피스 단계 배포(infra/runbooks/release/backoffice-stage-deploy.md, backoffice-foundation D-BF16). main에서 백오피스 배포 입력이
# 바뀌면 backoffice-api·backoffice-web·admin ingress image 셋을 build·검사·push하고, schema gate(api-cd가 이 commit의
# `packages/database/prisma`를 운영 DB에 적용했는지) 뒤 production-backoffice 승인을 받아 provenance를 만들고 검증한 다음 SSM
# document로 백오피스 host에 배포한다(host가 Docker 하한·secret 꺼내기·rollout·host 안 smoke를 하고, 실패면 직전 묶음으로 되돌린다.
# 이 workflow는 secret과 운영 DB에 닿지 않고, 백오피스 API는 migration을 실행하지 않는다). 공개 주소가 없어 외부 smoke가 없다.
# workflow_dispatch는 기록된 묶음의 재배포·rollback·백오피스 내림(maintenance)용이다. 공개 저장소라 account ID·registry host·ARN·
# node ID·IP를 log와 기록에 남기지 않는다(D-WB7). 신뢰 구조는 api-cd.yml과 같다(production-api-baseline D-AB12).
on:
  push:
    branches: [main]
    # 세 image가 복사하는 입력(두 Dockerfile COPY, ingress build context), 백오피스 host 묶음(compose·Alloy 설정·document
    # 원본·생성본)과 deploy document가 담는 secret 묶음 script, 이 workflow. scripts/infra/backoffice-host/
    # backoffice-cd-contract.test.mjs가 Dockerfile COPY·.dockerignore·document 원본과 맞는지 고정한다.
    paths:
      - apps/backoffice-api/**
      - apps/backoffice-web/**
      - packages/database/**
      - packages/shared/**
      - packages/tsconfig/**
      - packages/eslint-config/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - infra/deploy/api/rds-ca-bundle.sha256
      - infra/deploy/backoffice/**
      - infra/deploy/backoffice-api/**
      - infra/deploy/backoffice-web/**
      - infra/deploy/user/api/ssm/secret_bundle.py
      - .github/workflows/backoffice-cd.yml
  workflow_dispatch:
    inputs:
      action:
        description: deploy(기록된 묶음 재배포), rollback(host의 직전 묶음으로), maintenance(백오피스 내림)
        required: true
        type: choice
        options: [deploy, rollback, maintenance]
      backoffice_api_digest:
        description: dormduri/backoffice-api image digest (sha256:...)
        required: true
        type: string
      backoffice_web_digest:
        description: dormduri/backoffice-web image digest (sha256:...)
        required: true
        type: string
      backoffice_ingress_digest:
        description: dormduri/backoffice-ingress image digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read

# 백오피스 host는 user host와 다른 node라 group이 다르다(host의 두 document도 같은 host lock). 대기 자리는 하나다.
concurrency:
  group: backoffice-host-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_DOCUMENT: dormduri-backoffice-deploy
  # image를 만드는 도구도 tag와 digest로 고정한다. Renovate custom regex manager가 workflow의 `*_IMAGE` 값을 갱신하고
  # infra/image-inventory.json이 owner를 적는다.
  BUILDKIT_IMAGE: moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
  SBOM_SCANNER_IMAGE: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, scan and push the backoffice bundle images
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      backoffice_api_digest: ${{ steps.push.outputs.backoffice_api_digest }}
      backoffice_web_digest: ${{ steps.push.outputs.backoffice_web_digest }}
      backoffice_ingress_digest: ${{ steps.push.outputs.backoffice_ingress_digest }}
    # TypedSQL 생성(`prisma generate --sql`)이 migration을 적용한 PostgreSQL에 결과 type을 묻는다. 이 job 안에서만 쓰고 버리는
    # DB이며 production과 닿지 않는다(값은 CI와 같은 공개 개발 값).
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: dormduri_dev
          POSTGRES_PASSWORD: dormduri_dev_password
          POSTGRES_DB: dormduri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dormduri_dev -d dormduri"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # 생성 client(`packages/database/src/generated/prisma/`)는 Git 밖이라 backoffice-api Dockerfile이 build context에서 찾는다.
      # api-cd와 같이 백오피스 API Dockerfile의 NODE_IMAGE container가 `$RUNNER_TEMP/prisma-generate`의 설치 입력 사본과 일회용 DB
      # URL만 받아 만들고, 생성본은 그 사본 안의 일반 파일·디렉터리일 때만 workspace로 복사한다.
      - name: Generate the Prisma client and TypedSQL in an isolated container
        run: |
          node_image=$(sed -n 's/^ARG NODE_IMAGE=//p' infra/deploy/backoffice-api/Dockerfile)
          [[ $node_image =~ ^node:[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || { echo 'The backoffice API Dockerfile has no pinned NODE_IMAGE.' >&2; exit 1; }
          work="$RUNNER_TEMP/prisma-generate"
          mkdir "$work"
          tar -cf - package.json pnpm-lock.yaml pnpm-workspace.yaml packages/database packages/tsconfig | tar -xf - -C "$work"
          docker run --rm --network host --volume "$work:/workspace" --workdir /workspace \
            --env DATABASE_URL=postgresql://dormduri_dev:dormduri_dev_password@127.0.0.1:5432/dormduri?schema=public \
            --env DIRECT_URL=postgresql://dormduri_dev:dormduri_dev_password@127.0.0.1:5432/dormduri?schema=public \
            "$node_image" sh -euc '
              npm install --global --no-audit --no-fund "$(node -p "require(\"./package.json\").packageManager")"
              pnpm install --frozen-lockfile --filter @repo/database
              pnpm --dir packages/database exec prisma migrate deploy --schema prisma/schema.prisma
              pnpm --dir packages/database prisma:generate'
          generated=packages/database/src/generated/prisma
          [ "$(cd "$work/$generated" && pwd -P)" = "$(cd "$work" && pwd -P)/$generated" ] || { echo 'The generated client is not a directory inside the copy.' >&2; exit 1; }
          [ -z "$(find "$work/$generated" ! -type f ! -type d -print -quit)" ] || { echo 'The generated client holds something other than files and directories.' >&2; exit 1; }
          mkdir -p packages/database/src/generated
          cp -R "$work/$generated" packages/database/src/generated/
          test -f packages/database/src/generated/prisma/client.ts
          test -f packages/database/src/generated/prisma/sql.ts

      # 같은 commit·builder에서 세 image를 build한다. SBOM은 image index의 attestation manifest로만 남긴다(ECR 비공개, workflow
      # artifact 없음). provenance는 승인 뒤 deploy job이 GitHub artifact attestation으로 만든다.
      - name: Build the three images as OCI layouts with an SBOM
        run: |
          docker buildx create --name backoffice-cd --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx build --builder backoffice-cd --platform linux/amd64 \
            --attest "type=sbom,generator=$SBOM_SCANNER_IMAGE" --provenance=false \
            --file infra/deploy/backoffice-api/Dockerfile --target runtime \
            --output "type=oci,dest=$RUNNER_TEMP/backoffice-api.oci,tar=false" .
          docker buildx build --builder backoffice-cd --platform linux/amd64 \
            --attest "type=sbom,generator=$SBOM_SCANNER_IMAGE" --provenance=false \
            --file infra/deploy/backoffice-web/Dockerfile --target runtime \
            --output "type=oci,dest=$RUNNER_TEMP/backoffice-web.oci,tar=false" .
          docker buildx build --builder backoffice-cd --platform linux/amd64 \
            --attest "type=sbom,generator=$SBOM_SCANNER_IMAGE" --provenance=false \
            --file infra/deploy/backoffice/ingress/Dockerfile \
            --output "type=oci,dest=$RUNNER_TEMP/backoffice-ingress.oci,tar=false" infra/deploy/backoffice/ingress

      - name: Scan the image filesystems before push
        run: |
          node scripts/infra/user-host/image-secret-scan.mjs "$RUNNER_TEMP/backoffice-api.oci" "$RUNNER_TEMP/backoffice-web.oci" \
            "$RUNNER_TEMP/backoffice-ingress.oci"

      # configure-aws-credentials는 assume한 role의 unique ID(AROA…)를 끌 수 없게 찍는다. 그 ID의 AROA 뒤 9자는 첫 bit,
      # account ID와 다음 임의 4bit로 정해진다. action이 찍기 전에 ARN secret의 account ID로 후보 32개를 만들어 가린다.
      # 남는 글자에는 account ID bit가 없다(D-WB7).
      - name: Mask the account part of the role ID
        env:
          ROLE_ARN: ${{ secrets.AWS_BACKOFFICE_PUBLISH_ROLE_ARN }}
        run: |
          IFS=: read -r _ _ _ _ account _ <<<"$ROLE_ARN"
          [[ $account =~ ^[0-9]{12}$ ]] || { echo 'The role ARN secret holds no account ID.' >&2; exit 1; }
          alphabet=ABCDEFGHIJKLMNOPQRSTUVWXYZ234567
          for top in 0 1; do
            for low in {0..15}; do
              bits=$(( ((top << 47) | (10#$account << 7) | (low << 3)) >> 3 ))
              prefix=AROA
              for shift in 40 35 30 25 20 15 10 5 0; do prefix+=${alphabet:$(( (bits >> shift) & 31 )):1}; done
              echo "::add-mask::$prefix"
            done
          done

      - name: Assume the publish role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BACKOFFICE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Registry host는 account ID를 담는다. login action이 그 주소를 찍기 전에 script 안에서 만들어 가린다.
      - name: Mask the registry host
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Log in to the registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        with:
          mask-password: 'true'

      # 검사한 layout을 digest 그대로 올린다. tag immutability라 같은 commit의 두 번째 push는 거부된다.
      - name: Push the scanned layouts without changing their digests
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for name in backoffice-api backoffice-web backoffice-ingress; do
            skopeo copy --quiet --all --preserve-digests \
              "oci:$RUNNER_TEMP/$name.oci" "docker://$REGISTRY/dormduri/$name:sha-$GITHUB_SHA"
            digest=$(jq -r '.manifests[0].digest' "$RUNNER_TEMP/$name.oci/index.json")
            echo "${name//-/_}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "dormduri/$name@$digest"
          done

  schema:
    name: Wait until the API stage deployed this schema
    needs: build
    # schema 순서(D-SF15·D-BF16): 운영 DB schema는 api-cd만 바꾼다. 승인 요청 전에 이 commit의 schema가 적용됐는지 본다.
    if: ${{ github.event_name == 'push' && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Wait for the api-cd deploy of this schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/infra/backoffice-host/schema-gate.mjs --sha="$GITHUB_SHA"

  deploy:
    name: Verify and deploy to the backoffice host
    needs: [build, schema]
    # dispatch도 main에서만 받는다(environment 보호 규칙과 이중). push는 build와 schema gate가 성공해야 한다.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (needs.build.result == 'success' && needs.schema.result == 'success')) }}
    runs-on: ubuntu-26.04
    # host command 하나(document 실행 상한 15분)와 승인 뒤 검증이 이 안에 끝난다.
    timeout-minutes: 45
    environment: production-backoffice
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      action: ${{ steps.request.outputs.action }}
      backoffice_api_digest: ${{ steps.request.outputs.backoffice_api_digest }}
      backoffice_web_digest: ${{ steps.request.outputs.backoffice_web_digest }}
      backoffice_ingress_digest: ${{ steps.request.outputs.backoffice_ingress_digest }}
      source_commit: ${{ steps.provenance.outputs.source_commit }}
      backoffice_api_sbom: ${{ steps.sbom.outputs.backoffice_api_sbom }}
      backoffice_web_sbom: ${{ steps.sbom.outputs.backoffice_web_sbom }}
      backoffice_ingress_sbom: ${{ steps.sbom.outputs.backoffice_ingress_sbom }}
      previous_safe_backoffice_api: ${{ steps.plan.outputs.previous_safe_backoffice_api }}
      previous_safe_backoffice_web: ${{ steps.plan.outputs.previous_safe_backoffice_web }}
      previous_safe_backoffice_ingress: ${{ steps.plan.outputs.previous_safe_backoffice_ingress }}
      smoke: ${{ steps.smoke.outputs.summary }}
      image_tag: ${{ steps.tags.outputs.image_tag }}
      git_tag: ${{ steps.tags.outputs.git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Resolve the deploy request
        id: request
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_API: ${{ inputs.backoffice_api_digest }}
          INPUT_WEB: ${{ inputs.backoffice_web_digest }}
          INPUT_INGRESS: ${{ inputs.backoffice_ingress_digest }}
          BUILT_API: ${{ needs.build.outputs.backoffice_api_digest }}
          BUILT_WEB: ${{ needs.build.outputs.backoffice_web_digest }}
          BUILT_INGRESS: ${{ needs.build.outputs.backoffice_ingress_digest }}
        run: |
          if [ "$EVENT" = push ]; then
            action=deploy; api=$BUILT_API; web=$BUILT_WEB; ingress=$BUILT_INGRESS
          else
            action=$INPUT_ACTION; api=$INPUT_API; web=$INPUT_WEB; ingress=$INPUT_INGRESS
          fi
          case "$action" in deploy|rollback|maintenance) ;; *) echo "unknown action"; exit 1 ;; esac
          for digest in "$api" "$web" "$ingress"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "a digest is not sha256:<64 hex>"; exit 1; }
          done
          {
            echo "action=$action"
            echo "backoffice_api_digest=$api"
            echo "backoffice_web_digest=$web"
            echo "backoffice_ingress_digest=$ingress"
          } >> "$GITHUB_OUTPUT"
          echo "$action dormduri/backoffice-api@$api dormduri/backoffice-web@$web dormduri/backoffice-ingress@$ingress"

      # 승인 대기 중 main의 백오피스 배포 입력이 바뀌었으면 이 실행은 옛 묶음이다(runbook 대기 실행 규칙).
      - name: Reject a push run that a newer deploy input change superseded
        id: fresh
        if: ${{ github.event_name == 'push' }}
        run: bash scripts/infra/user-host/deploy-inputs-current.sh "$GITHUB_SHA" origin/main backoffice

      # 승인 뒤 첫 단계에서 build job 출력 digest에 provenance를 만든다. subject 이름에 registry host를 넣지 않고,
      # registry에 attestation을 올리지 않는다.
      - name: Attest the backoffice API image
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: dormduri/backoffice-api
          subject-digest: ${{ needs.build.outputs.backoffice_api_digest }}
          push-to-registry: false
          show-summary: false

      - name: Attest the backoffice Web image
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: dormduri/backoffice-web
          subject-digest: ${{ needs.build.outputs.backoffice_web_digest }}
          push-to-registry: false
          show-summary: false

      - name: Attest the admin ingress image
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: dormduri/backoffice-ingress
          subject-digest: ${{ needs.build.outputs.backoffice_ingress_digest }}
          push-to-registry: false
          show-summary: false

      - name: Mask the account part of the role ID
        env:
          ROLE_ARN: ${{ secrets.AWS_BACKOFFICE_DEPLOY_ROLE_ARN }}
        run: |
          IFS=: read -r _ _ _ _ account _ <<<"$ROLE_ARN"
          [[ $account =~ ^[0-9]{12}$ ]] || { echo 'The role ARN secret holds no account ID.' >&2; exit 1; }
          alphabet=ABCDEFGHIJKLMNOPQRSTUVWXYZ234567
          for top in 0 1; do
            for low in {0..15}; do
              bits=$(( ((top << 47) | (10#$account << 7) | (low << 3)) >> 3 ))
              prefix=AROA
              for shift in 40 35 30 25 20 15 10 5 0; do prefix+=${alphabet:$(( (bits >> shift) & 31 )):1}; done
              echo "::add-mask::$prefix"
            done
          done

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BACKOFFICE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Mask the registry host
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Log in to the registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        with:
          mask-password: 'true'

      # 세 digest가 main의 이 workflow가 만든 attestation을 갖는지 본다. push는 이 실행 commit이어야 하고, dispatch는 세
      # source commit이 같고 그 commit의 백오피스 배포 기록 묶음이 입력과 같아야 한다.
      - name: Verify the provenance of the three images
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API: ${{ steps.request.outputs.backoffice_api_digest }}
          WEB: ${{ steps.request.outputs.backoffice_web_digest }}
          INGRESS: ${{ steps.request.outputs.backoffice_ingress_digest }}
        run: |
          source_digest=()
          if [ "$EVENT" = push ]; then source_digest=(--source-digest "$GITHUB_SHA"); fi
          declare -A digests=([backoffice-api]=$API [backoffice-web]=$WEB [backoffice-ingress]=$INGRESS)
          for name in backoffice-api backoffice-web backoffice-ingress; do
            digest=${digests[$name]}
            gh attestation verify "oci://$REGISTRY/dormduri/$name@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/backoffice-cd.yml" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              "${source_digest[@]}" \
              --format json \
              | jq -r '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique | .[]' \
              > "$RUNNER_TEMP/$name.source"
            [ "$(wc -l < "$RUNNER_TEMP/$name.source")" -eq 1 ] || { echo "$name: attestations name more than one source commit"; exit 1; }
          done
          source=$(cat "$RUNNER_TEMP/backoffice-api.source")
          [[ "$source" =~ ^[a-f0-9]{40}$ ]] || { echo "the attested source commit is malformed"; exit 1; }
          for name in backoffice-web backoffice-ingress; do
            [ "$source" = "$(cat "$RUNNER_TEMP/$name.source")" ] || { echo "the images come from different commits"; exit 1; }
          done
          if [ "$EVENT" = workflow_dispatch ]; then
            node scripts/infra/user-host/release-record.mjs match --stage=backoffice --source="$source" --backoffice-api="$API" \
              --backoffice-web="$WEB" --backoffice-ingress="$INGRESS"
          fi
          echo "source_commit=$source" >> "$GITHUB_OUTPUT"
          echo "provenance verified: source $source"

      # SBOM은 build가 image index에 붙인 attestation manifest다(D-WB3). 그 manifest가 SPDX layer를 갖는지 본다.
      - name: Confirm the SBOM attestation of the three images
        id: sbom
        env:
          API: ${{ steps.request.outputs.backoffice_api_digest }}
          WEB: ${{ steps.request.outputs.backoffice_web_digest }}
          INGRESS: ${{ steps.request.outputs.backoffice_ingress_digest }}
        run: |
          declare -A digests=([backoffice-api]=$API [backoffice-web]=$WEB [backoffice-ingress]=$INGRESS)
          for name in backoffice-api backoffice-web backoffice-ingress; do
            digest=${digests[$name]}
            aws ecr batch-get-image --repository-name "dormduri/$name" --image-ids imageDigest="$digest" \
              --accepted-media-types application/vnd.oci.image.index.v1+json \
              --query 'images[0].imageManifest' --output text > "$RUNNER_TEMP/$name.index.json"
            attestation=$(node scripts/infra/user-host/release-record.mjs attestation-manifest "$RUNNER_TEMP/$name.index.json")
            aws ecr batch-get-image --repository-name "dormduri/$name" --image-ids imageDigest="$attestation" \
              --accepted-media-types application/vnd.oci.image.manifest.v1+json \
              --query 'images[0].imageManifest' --output text > "$RUNNER_TEMP/$name.attestation.json"
            node scripts/infra/user-host/release-record.mjs check-sbom "$RUNNER_TEMP/$name.attestation.json"
            echo "${name//-/_}_sbom=$attestation" >> "$GITHUB_OUTPUT"
            echo "dormduri/$name SBOM attestation manifest $attestation"
          done

      # 백오피스 배포 기록으로 host의 지금 묶음과 직전 안전 묶음을 알아낸다. rollback은 마지막 기록의 previous_safe 묶음만 받는다.
      - name: Plan the run from the deploy records
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.request.outputs.action }}
          API: ${{ steps.request.outputs.backoffice_api_digest }}
          WEB: ${{ steps.request.outputs.backoffice_web_digest }}
          INGRESS: ${{ steps.request.outputs.backoffice_ingress_digest }}
        run: |
          node scripts/infra/user-host/release-record.mjs plan --stage=backoffice --action="$ACTION" --backoffice-api="$API" \
            --backoffice-web="$WEB" --backoffice-ingress="$INGRESS" >> "$GITHUB_OUTPUT"

      # document는 Owner가 저장소 생성본으로 console에서 만든다. 다르면 host에 아무것도 보내지 않는다.
      - name: Check the deploy document hash
        id: document
        run: |
          expected=$(sha256sum infra/deploy/backoffice/ssm/dormduri-backoffice-deploy.json | cut -d' ' -f1)
          actual=$(aws ssm describe-document --name "$DEPLOY_DOCUMENT" --query Document.Hash --output text)
          if [ "$actual" != "$expected" ]; then
            echo "the AWS document differs from infra/deploy/backoffice/ssm/dormduri-backoffice-deploy.json"
            exit 1
          fi
          echo "hash=$expected" >> "$GITHUB_OUTPUT"
          echo "document hash matches ($expected)"

      # host가 Docker Engine 하한 확인 → image 받기 → secret 꺼내기·설치 → rollout → host 안 smoke(고정 Host만 화면, 다른 Host 421,
      # 다른 Origin 403, metric token, publish 127.0.0.1:4300 하나) → 기록 → Alloy(fail-open)를 한다. rollout 뒤 실패면 host가 직전
      # 묶음으로 되돌리고, 직전이 없으면 세 service를 내린다(document 원본 infra/deploy/backoffice/ssm/deploy.sh).
      - name: Send the deploy command and wait for its command-level status
        id: send
        env:
          ACTION: ${{ steps.request.outputs.action }}
          API: ${{ steps.request.outputs.backoffice_api_digest }}
          WEB: ${{ steps.request.outputs.backoffice_web_digest }}
          INGRESS: ${{ steps.request.outputs.backoffice_ingress_digest }}
          HASH: ${{ steps.document.outputs.hash }}
        run: bash scripts/infra/user-host/ssm-send.sh "$ACTION" "$API" "$WEB" "$INGRESS" "$HASH"

      # 공개 주소가 없어 외부 smoke가 없다(D-BF2). host 안 smoke는 위 command의 Success에 든다.
      - name: Record the host smoke summary
        id: smoke
        run: |
          echo "summary=host smoke (backoffice): SSM command Success" >> "$GITHUB_OUTPUT"

      - name: Name the deploy tags
        id: tags
        run: node scripts/infra/user-host/release-record.mjs tags --stage=backoffice --run-number="$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # 멈춘 실행은 단계 기록이 아니다. 멈춘 조건을 run 요약에 남긴다(release evidence 단계 배포 기록).
      - name: Write the stop condition to the run summary
        if: ${{ failure() }}
        env:
          ACTION: ${{ steps.request.outputs.action }}
          API: ${{ steps.request.outputs.backoffice_api_digest }}
          WEB: ${{ steps.request.outputs.backoffice_web_digest }}
          INGRESS: ${{ steps.request.outputs.backoffice_ingress_digest }}
          FRESH: ${{ steps.fresh.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
          SBOM: ${{ steps.sbom.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          DOCUMENT: ${{ steps.document.outcome }}
          SEND: ${{ steps.send.outcome }}
        run: |
          {
            echo "## Backoffice CD stopped"
            echo ""
            echo "- action: ${ACTION:-unresolved}, bundle: dormduri/backoffice-api@${API:-none} dormduri/backoffice-web@${WEB:-none} dormduri/backoffice-ingress@${INGRESS:-none}"
            echo "- newer change check: ${FRESH:-not run}, provenance: ${PROVENANCE:-not run}, SBOM: ${SBOM:-not run}"
            echo "- deploy records: ${PLAN:-not run}, document hash: ${DOCUMENT:-not run}, host command: ${SEND:-not run}"
            echo ""
            echo "Read the host result (RESULT line) in the console before the next run. Input or state refusal (exit 2, including a"
            echo "Docker Engine below 28 or a disabled loopback protection) and host lock (exit 75) leave the host as it was. A failed"
            echo "rollout rolls back to the previous bundle on the host, or takes the backoffice down when there is none (runbook)."
            echo "A host command that ends without a RESULT line (TimedOut, Cancelled) leaves the host state unknown: read the"
            echo "host current record and the running digests before the next run (runbook failure response)."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the deployed bundle in the registry
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.action != 'maintenance' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask the account part of the role ID
        env:
          ROLE_ARN: ${{ secrets.AWS_BACKOFFICE_PUBLISH_ROLE_ARN }}
        run: |
          IFS=: read -r _ _ _ _ account _ <<<"$ROLE_ARN"
          [[ $account =~ ^[0-9]{12}$ ]] || { echo 'The role ARN secret holds no account ID.' >&2; exit 1; }
          alphabet=ABCDEFGHIJKLMNOPQRSTUVWXYZ234567
          for top in 0 1; do
            for low in {0..15}; do
              bits=$(( ((top << 47) | (10#$account << 7) | (low << 3)) >> 3 ))
              prefix=AROA
              for shift in 40 35 30 25 20 15 10 5 0; do prefix+=${alphabet:$(( (bits >> shift) & 31 )):1}; done
              echo "::add-mask::$prefix"
            done
          done

      - name: Assume the publish role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BACKOFFICE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # 배포한 묶음에 deploy- tag를 더해 ECR lifecycle의 최근 배포 보존 규칙에 넣는다. 출력에는 registry 정보를 찍지 않는다.
      - name: Add the deploy tag to the three digests
        env:
          IMAGE_TAG: ${{ needs.deploy.outputs.image_tag }}
          API: ${{ needs.deploy.outputs.backoffice_api_digest }}
          WEB: ${{ needs.deploy.outputs.backoffice_web_digest }}
          INGRESS: ${{ needs.deploy.outputs.backoffice_ingress_digest }}
        run: |
          declare -A digests=([backoffice-api]=$API [backoffice-web]=$WEB [backoffice-ingress]=$INGRESS)
          for name in backoffice-api backoffice-web backoffice-ingress; do
            digest=${digests[$name]}
            # 다시 실행한 job이 이미 붙인 tag에서 멈추지 않게, 같은 digest에 같은 tag가 있으면 건너뛴다(tag immutability).
            existing=$(aws ecr batch-get-image --repository-name "dormduri/$name" --image-ids imageTag="$IMAGE_TAG" \
              --accepted-media-types application/vnd.oci.image.index.v1+json \
              --query 'images[0].imageId.imageDigest' --output text)
            if [ "$existing" = "$digest" ]; then
              echo "dormduri/$name@$digest already tagged $IMAGE_TAG"
              continue
            fi
            # 명령 치환이 끝 줄바꿈을 지워 manifest 원문 그대로 다시 올린다(바이트가 다르면 digest가 달라 거부된다).
            manifest=$(aws ecr batch-get-image --repository-name "dormduri/$name" --image-ids imageDigest="$digest" \
              --accepted-media-types application/vnd.oci.image.index.v1+json \
              --query 'images[0].imageManifest' --output text)
            tagged=$(aws ecr put-image --repository-name "dormduri/$name" --image-tag "$IMAGE_TAG" \
              --image-manifest "$manifest" \
              --image-manifest-media-type application/vnd.oci.image.index.v1+json --image-digest "$digest" \
              --query image.imageId.imageDigest --output text)
            [ "$tagged" = "$digest" ] || { echo "$name: tagged digest differs"; exit 1; }
            echo "dormduri/$name@$digest tagged $IMAGE_TAG"
          done

  record:
    name: Record the deploy tag and Release
    needs: [deploy, tag]
    # host가 바뀐 실행은 tag 결과와 상관없이 기록한다. 기록이 host보다 늦으면 다음 실행의 직전 묶음 계산이 어긋난다.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # 단계 기록(infra/runbooks/release/production-release-evidence.md)을 만들고 공개 기록 scanner를 통과한 것만 run 요약과
      # Release 본문에 쓴다.
      - name: Create the deploy tag and Release with the stage record
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.deploy.outputs.action }}
          API: ${{ needs.deploy.outputs.backoffice_api_digest }}
          WEB: ${{ needs.deploy.outputs.backoffice_web_digest }}
          INGRESS: ${{ needs.deploy.outputs.backoffice_ingress_digest }}
          API_SBOM: ${{ needs.deploy.outputs.backoffice_api_sbom }}
          WEB_SBOM: ${{ needs.deploy.outputs.backoffice_web_sbom }}
          INGRESS_SBOM: ${{ needs.deploy.outputs.backoffice_ingress_sbom }}
          PREVIOUS_API: ${{ needs.deploy.outputs.previous_safe_backoffice_api }}
          PREVIOUS_WEB: ${{ needs.deploy.outputs.previous_safe_backoffice_web }}
          PREVIOUS_INGRESS: ${{ needs.deploy.outputs.previous_safe_backoffice_ingress }}
          SOURCE: ${{ needs.deploy.outputs.source_commit }}
          SMOKE: ${{ needs.deploy.outputs.smoke }}
          GIT_TAG: ${{ needs.deploy.outputs.git_tag }}
          EVENT: ${{ github.event_name }}
          OPERATOR: ${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/infra/user-host/release-record.mjs record --stage=backoffice --action="$ACTION" --release-id="$GIT_TAG" \
            --source="$SOURCE" --backoffice-api="$API" --backoffice-web="$WEB" --backoffice-ingress="$INGRESS" \
            --backoffice-api-sbom="$API_SBOM" --backoffice-web-sbom="$WEB_SBOM" --backoffice-ingress-sbom="$INGRESS_SBOM" \
            --event="$EVENT" --run-url="$RUN_URL" --smoke="$SMOKE" --previous-backoffice-api="$PREVIOUS_API" \
            --previous-backoffice-web="$PREVIOUS_WEB" --previous-backoffice-ingress="$PREVIOUS_INGRESS" \
            --operator="$OPERATOR" \
            > "$RUNNER_TEMP/record.md"
          node scripts/infra/user-host/public-record-scan.mjs "$RUNNER_TEMP/record.md"
          cat "$RUNNER_TEMP/record.md" >> "$GITHUB_STEP_SUMMARY"
          # 다시 실행한 job은 이미 만든 Release를 그대로 둔다(같은 run number라 tag 이름이 같다).
          if gh release view "$GIT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GIT_TAG already exists"
            exit 0
          fi
          # tag는 이 실행의 commit(GITHUB_SHA)에 둔다(api-cd와 같은 이유, 배포한 source는 본문 release_commit_sha).
          gh release create "$GIT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$GIT_TAG ($ACTION)" --notes-file "$RUNNER_TEMP/record.md"
