name: API Production Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render and validate deploy commands without touching production resources.
        type: boolean
        required: true
        default: true
      image_tag:
        description: API image tag to build/deploy. Defaults to the workflow commit SHA.
        type: string
        required: false
      restore_drill_evidence_id:
        description: Required for non-dry-run deploy; workflow run id or manual evidence id for the latest backup/restore drill.
        type: string
        required: false
      run_migrations:
        description: Run Prisma migrate deploy before rollout.
        type: boolean
        required: true
        default: true
      run_role_grants:
        description: Apply DB role grants before rollout.
        type: boolean
        required: true
        default: true
      run_smoke:
        description: Run DB credential smoke and HTTP/metrics release smoke.
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Protected API production deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: production

    env:
      API_IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      RESTORE_DRILL_EVIDENCE_ID: ${{ inputs.restore_drill_evidence_id }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      DEPLOY_TRANSPORT: ${{ vars.DEPLOY_TRANSPORT || 'ssm' }}
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      DEPLOY_WORKDIR: ${{ vars.DEPLOY_WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Generate Prisma artifacts
        run: pnpm api:prisma:generate

      - name: API preflight checks
        run: pnpm check:api

      - name: API tests
        run: pnpm test:api

      - name: API production build
        run: pnpm build:api

      - name: Validate API deploy compose
        run: docker compose -f infra/deploy/docker-compose.api.yml config >/tmp/knu-api-compose.yml

      - name: Build API image
        run: docker build -f infra/deploy/api/Dockerfile -t knu-roommate-api:${API_IMAGE_TAG} .

      - name: Validate protected production deploy inputs
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo 'dry-run: protected production deploy inputs will be validated without resource mutation'
            exit 0
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo 'non-dry-run production deploy must run from main' >&2
            exit 64
          fi
          if [ -z "${AWS_REGION:-}" ]; then
            echo 'missing required GitHub environment variable: AWS_REGION' >&2
            exit 64
          fi
          if [ -z "${AWS_ROLE_TO_ASSUME:-}" ]; then
            echo 'missing required GitHub environment variable: AWS_ROLE_TO_ASSUME' >&2
            exit 64
          fi
          if [ -z "${RESTORE_DRILL_EVIDENCE_ID:-}" ]; then
            echo 'missing required input for non-dry-run deploy: restore_drill_evidence_id' >&2
            exit 64
          fi

      - name: Configure AWS credentials through OIDC
        if: ${{ inputs.dry_run == false }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: knu-roommate-api-production-deploy

      - name: Prisma migration deploy
        if: ${{ inputs.run_migrations == true }}
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            MIGRATION_DATABASE_URL='postgresql://redacted@example.invalid/db' pnpm api:db:deploy:migrate -- --dry-run
          else
            pnpm api:db:deploy:migrate
          fi

      - name: DB role grant apply
        if: ${{ inputs.run_role_grants == true }}
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DB_GRANT_SCHEMA: ${{ vars.DB_GRANT_SCHEMA }}
          DB_APP_RUNTIME_ROLE: ${{ vars.DB_APP_RUNTIME_ROLE }}
          DB_RETENTION_WORKER_ROLE: ${{ vars.DB_RETENTION_WORKER_ROLE }}
          DB_RETENTION_DISCLOSURE_ROLE: ${{ vars.DB_RETENTION_DISCLOSURE_ROLE }}
          DB_AUTH_CLEANUP_WORKER_ROLE: ${{ vars.DB_AUTH_CLEANUP_WORKER_ROLE }}
          DB_READONLY_ROLE: ${{ vars.DB_READONLY_ROLE }}
          DB_MIGRATION_ROLE: ${{ vars.DB_MIGRATION_ROLE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            MIGRATION_DATABASE_URL='postgresql://redacted@example.invalid/db' pnpm api:db:deploy:role-grants -- --dry-run
          else
            pnpm api:db:deploy:role-grants
          fi

      - name: DB credential smoke
        if: ${{ inputs.run_smoke == true }}
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_WORKER_DATABASE_URL: ${{ secrets.RETENTION_WORKER_DATABASE_URL }}
          RETENTION_DISCLOSURE_DATABASE_URL: ${{ secrets.RETENTION_DISCLOSURE_DATABASE_URL }}
          DB_GRANT_SCHEMA: ${{ vars.DB_GRANT_SCHEMA }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm api:db:deploy:smoke -- --dry-run
          else
            pnpm api:db:deploy:smoke
          fi

      - name: API/nginx rollout
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            infra/deploy/scripts/api-production-rollout.sh --dry-run
          else
            infra/deploy/scripts/api-production-rollout.sh
          fi

      - name: HTTP readiness and metrics smoke
        if: ${{ inputs.run_smoke == true }}
        env:
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            infra/deploy/scripts/api-release-smoke.sh --dry-run
          else
            infra/deploy/scripts/api-release-smoke.sh
          fi

      - name: Write release evidence summary
        run: |
          mkdir -p release-evidence
          cat > release-evidence/api-production-deploy-summary.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          sha=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          image_tag=${API_IMAGE_TAG}
          dry_run=${{ inputs.dry_run }}
          run_migrations=${{ inputs.run_migrations }}
          run_role_grants=${{ inputs.run_role_grants }}
          run_smoke=${{ inputs.run_smoke }}
          deploy_transport=${DEPLOY_TRANSPORT}
          restore_drill_evidence_id=${RESTORE_DRILL_EVIDENCE_ID}
          EOF

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: api-production-deploy-evidence-${{ github.run_id }}
          path: release-evidence/
          retention-days: 14
