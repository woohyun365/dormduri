version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps): 자동 업데이트'
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/infra/deploy/api'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(container): 이미지 업데이트'

  - package-ecosystem: 'docker'
    directory: '/infra/deploy/web'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(container): 이미지 업데이트'

  - package-ecosystem: 'docker-compose'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'

  - package-ecosystem: 'docker-compose'
    directory: '/infra/deploy'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'

  - package-ecosystem: 'docker-compose'
    directory: '/infra/observability'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'
    groups:
      observability-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker-compose'
    directory: '/infra/rehearsal'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'
