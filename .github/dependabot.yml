version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps): 의존성 업데이트'
    groups:
      lint-tooling:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'eslint-config-*'
          - 'eslint-plugin-*'
        update-types:
          - 'minor'
          - 'patch'
      web-framework-tooling:
        patterns:
          - 'next'
          - '@next/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'
      web-test-storybook-tooling:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - '@testing-library/*'
          - '@playwright/*'
        update-types:
          - 'minor'
          - 'patch'
      api-framework-persistence:
        patterns:
          - '@nestjs/*'
          - 'prisma'
          - '@prisma/*'
          - 'pg'
        update-types:
          - 'minor'
          - 'patch'
    # @eslint/js 10 expects ESLint 10, while eslint-plugin-import 2.x supports through ESLint 9.
    ignore:
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps): 자동 업데이트'
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/infra/deploy/api'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(container): 이미지 업데이트'

  - package-ecosystem: 'docker'
    directory: '/infra/deploy/web'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(container): 이미지 업데이트'

  - package-ecosystem: 'docker-compose'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'

  - package-ecosystem: 'docker-compose'
    directory: '/infra/deploy'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'

  - package-ecosystem: 'docker-compose'
    directory: '/infra/observability'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'
    groups:
      observability-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker-compose'
    directory: '/infra/rehearsal'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(compose): 구성 업데이트'
