# Local resource labels for the named volumes of a full-stack Web/observability project.
# Only the full-stack runner appends this file; why fixed-name projects stay unlabeled: compose.volume-labels.api.yml.
# Listing and cleanup: infra/runbooks/rehearsal/local-environments.md.
volumes:
  prometheus-data:
    labels: &local-resource-labels
      dormduri.local.created-by: ${LOCAL_RESOURCE_CREATED_BY:-manual}
      dormduri.local.run-id: ${LOCAL_RESOURCE_RUN_ID:-local}
  loki-data:
    labels: *local-resource-labels
  alloy-data:
    labels: *local-resource-labels
  grafana-data:
    labels: *local-resource-labels
  alertmanager-data:
    labels: *local-resource-labels
