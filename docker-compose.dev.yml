services:
  postgres:
    image: postgres:16-alpine
    container_name: knu-roommate-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: knu_roommate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - knu-roommate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d knu_roommate']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  knu-roommate-postgres-data:
