services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: knu-roommate-postgres-dev
    restart: unless-stopped
    command: ['postgres', '-c', 'timezone=Asia/Seoul']
    environment:
      POSTGRES_DB: knu_roommate
      POSTGRES_USER: knu_dev
      POSTGRES_PASSWORD: knu_dev_password
      TZ: Asia/Seoul
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - knu-roommate-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knu_dev -d knu_roommate']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  knu-roommate-postgres-data:
