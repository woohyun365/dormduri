name: dormduri-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: dormduri-postgres-dev
    restart: unless-stopped
    command: ['postgres', '-c', 'timezone=Asia/Seoul']
    environment:
      POSTGRES_DB: dormduri
      POSTGRES_USER: dormduri_dev
      POSTGRES_PASSWORD: dormduri_dev_password
      TZ: Asia/Seoul
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dormduri-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dormduri_dev -d dormduri']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dormduri-postgres-data:
