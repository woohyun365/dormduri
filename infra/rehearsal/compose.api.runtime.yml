services:
  api:
    build:
      labels:
        dormduri.local.created-by: ${LOCAL_RESOURCE_CREATED_BY:-manual}
        dormduri.local.run-id: ${LOCAL_RESOURCE_RUN_ID:-local}
    networks:
      - api-internal
      - observability
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1408M
        reservations:
          memory: 512M

  nginx:
    networks:
      - api-internal
      - observability
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 96M
        reservations:
          memory: 32M

networks:
  api-internal:
    driver: bridge
  observability:
    name: ${OBSERVABILITY_NETWORK:-dormduri-observability}
    external: true
