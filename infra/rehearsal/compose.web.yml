services:
  web:
    build:
      context: ../..
      dockerfile: infra/deploy/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://web.local.invalid
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SENTRY_ENABLED: '0'
        NEXT_PUBLIC_SENTRY_RUNTIME_ERRORS_ENABLED: '1'
        NEXT_PUBLIC_SENTRY_PERFORMANCE_ENABLED: '1'
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: '0.1'
        NEXT_PUBLIC_SENTRY_PRIVACY_APPROVED: '0'
        NEXT_PUBLIC_SENTRY_RELEASE_EVIDENCE_APPROVED: '0'
        NEXT_PUBLIC_WEB_OBSERVABILITY_ENVIRONMENT: local
        NEXT_PUBLIC_WEB_RELEASE: ${WEB_REHEARSAL_RELEASE:-local-rehearsal}
    image: knu-roommate-web:${WEB_IMAGE_TAG:-local-rehearsal}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: Asia/Seoul
      WEB_APP_URL: https://web.local.invalid
      API_URL: ${WEB_REHEARSAL_API_URL:-http://nginx}
      WEB_OBSERVABILITY_ENVIRONMENT: local
      WEB_RELEASE: ${WEB_REHEARSAL_RELEASE:-local-rehearsal}
      WEB_BFF_OPERATIONAL_LOGGING_ENABLED: '1'
      WEB_BFF_SUCCESS_SAMPLE_RATE: '1'
    ports:
      - 127.0.0.1:${WEB_REHEARSAL_PORT:-3300}:3000
    restart: unless-stopped
    init: true
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.55'
          memory: 320M
        reservations:
          memory: 160M
