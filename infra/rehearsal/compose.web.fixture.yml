services:
  web-upstream:
    image: ${WEB_UPSTREAM_IMAGE:-node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53}
    command: ['node', '/fixture/web-upstream.mjs']
    environment:
      PORT: 4100
    volumes:
      - ./fixtures/web-upstream.mjs:/fixture/web-upstream.mjs:ro
    expose:
      - '4100'
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - observability
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  web:
    environment:
      API_URL: http://web-upstream:4100
    depends_on:
      web-upstream:
        condition: service_healthy
