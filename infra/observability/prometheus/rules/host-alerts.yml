# user host 경보(production-api-baseline D-AB14·D-AB16). 지표는 Alloy prometheus.exporter.unix(job host)이고 기준은
# production-operations.json hostAlerts(disk·inode 80% warning·90% critical)와 사용 가능 memory 10% 미만이다. warning은 critical
# 구간을 빼서 한 번에 하나만 울린다. root filesystem 지표가 없으면(제외된 fs type, host mount 누락) disk·inode 경보가 조용히
# 꺼지므로 그 지표가 없는 상태도 경보한다.
groups:
  - name: dormduri-host
    rules:
      - alert: HostDiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{job="host",mountpoint="/"} / node_filesystem_size_bytes{job="host",mountpoint="/"}) * 100 >= 80
          < 90
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: host 디스크 사용률이 80%를 넘었습니다.
          runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응

      - alert: HostDiskUsageCritical
        expr: |
          (1 - node_filesystem_avail_bytes{job="host",mountpoint="/"} / node_filesystem_size_bytes{job="host",mountpoint="/"}) * 100 >= 90
        for: 5m
        labels:
          severity: critical
          service: host
        annotations:
          summary: host 디스크 사용률이 90%를 넘었습니다.
          runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응

      - alert: HostInodeUsageHigh
        expr: |
          (1 - node_filesystem_files_free{job="host",mountpoint="/"} / node_filesystem_files{job="host",mountpoint="/"}) * 100 >= 80
          < 90
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: host inode 사용률이 80%를 넘었습니다.
          runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응

      - alert: HostInodeUsageCritical
        expr: |
          (1 - node_filesystem_files_free{job="host",mountpoint="/"} / node_filesystem_files{job="host",mountpoint="/"}) * 100 >= 90
        for: 5m
        labels:
          severity: critical
          service: host
        annotations:
          summary: host inode 사용률이 90%를 넘었습니다.
          runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응

      - alert: HostMemoryAvailableLow
        expr: node_memory_MemAvailable_bytes{job="host"} / node_memory_MemTotal_bytes{job="host"} < 0.10
        for: 10m
        labels:
          severity: critical
          service: host
        annotations:
          summary: host 사용 가능 memory가 10% 미만입니다.
          runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응

      - alert: HostRootFilesystemMetricsMissing
        expr: absent(node_filesystem_avail_bytes{job="host",mountpoint="/"})
        for: 15m
        labels:
          severity: warning
          service: host
        annotations:
          summary: host root filesystem 지표가 없어 disk·inode 경보가 동작하지 않습니다.
          runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
