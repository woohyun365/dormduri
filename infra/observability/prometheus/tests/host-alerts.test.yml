# host 경보: disk·inode 80% warning(90% 미만), 90% critical, memory 10% 미만 critical. 사용률은 기준 바로 아래·같은 값
# (79.9%·80.0%·89.9%·90.0%)을 차례로 지나고 memory는 10%와 9.975%라, 기준·비교 연산자·`for`가 바뀌면 경계 앞뒤 평가의 기대가
# 깨진다. 기준 숫자는 validate-stack.mjs가 production-operations.json hostAlerts와도 대조한다.
rule_files:
  - ../rules/host-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # disk·inode: 0~14분 79.9%, 15~29분 80.0%, 30~44분 89.9%, 45분부터 90.0%.
      - series: 'node_filesystem_size_bytes{job="host",instance="alloy:12345",service="host",env="production",mountpoint="/",device="/dev/root",fstype="ext4"}'
        values: '1000x61'
      - series: 'node_filesystem_avail_bytes{job="host",instance="alloy:12345",service="host",env="production",mountpoint="/",device="/dev/root",fstype="ext4"}'
        values: '201x14 200x14 101x14 100x16'
      - series: 'node_filesystem_files{job="host",instance="alloy:12345",service="host",env="production",mountpoint="/",device="/dev/root",fstype="ext4"}'
        values: '1000x61'
      - series: 'node_filesystem_files_free{job="host",instance="alloy:12345",service="host",env="production",mountpoint="/",device="/dev/root",fstype="ext4"}'
        values: '201x14 200x14 101x14 100x16'
      # memory: 0~14분 정확히 10%(경보 아님), 15분부터 9.975%. 10분이 지나야(25분) critical이다.
      - series: 'node_memory_MemTotal_bytes{job="host",instance="alloy:12345",service="host",env="production"}'
        values: '4000x61'
      - series: 'node_memory_MemAvailable_bytes{job="host",instance="alloy:12345",service="host",env="production"}'
        values: '400x14 399x46'
    alert_rule_test:
      - eval_time: 14m
        alertname: HostDiskUsageHigh
        exp_alerts: []
      - eval_time: 14m
        alertname: HostDiskUsageCritical
        exp_alerts: []
      - eval_time: 24m
        alertname: HostDiskUsageHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: HostDiskUsageHigh
        exp_alerts:
          - exp_labels:
              {
                severity: warning,
                service: host,
                job: host,
                instance: 'alloy:12345',
                env: production,
                mountpoint: /,
                device: /dev/root,
                fstype: ext4,
              }
            exp_annotations:
              summary: host 디스크 사용률이 80%를 넘었습니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
      - eval_time: 25m
        alertname: HostDiskUsageCritical
        exp_alerts: []
      - eval_time: 44m
        alertname: HostDiskUsageHigh
        exp_alerts:
          - exp_labels:
              {
                severity: warning,
                service: host,
                job: host,
                instance: 'alloy:12345',
                env: production,
                mountpoint: /,
                device: /dev/root,
                fstype: ext4,
              }
            exp_annotations:
              summary: host 디스크 사용률이 80%를 넘었습니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
      - eval_time: 44m
        alertname: HostDiskUsageCritical
        exp_alerts: []
      - eval_time: 45m
        alertname: HostDiskUsageHigh
        exp_alerts: []
      - eval_time: 49m
        alertname: HostDiskUsageCritical
        exp_alerts: []
      - eval_time: 50m
        alertname: HostDiskUsageCritical
        exp_alerts:
          - exp_labels:
              {
                severity: critical,
                service: host,
                job: host,
                instance: 'alloy:12345',
                env: production,
                mountpoint: /,
                device: /dev/root,
                fstype: ext4,
              }
            exp_annotations:
              summary: host 디스크 사용률이 90%를 넘었습니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
      - eval_time: 50m
        alertname: HostDiskUsageHigh
        exp_alerts: []
      - eval_time: 14m
        alertname: HostInodeUsageHigh
        exp_alerts: []
      - eval_time: 14m
        alertname: HostInodeUsageCritical
        exp_alerts: []
      - eval_time: 24m
        alertname: HostInodeUsageHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: HostInodeUsageHigh
        exp_alerts:
          - exp_labels:
              {
                severity: warning,
                service: host,
                job: host,
                instance: 'alloy:12345',
                env: production,
                mountpoint: /,
                device: /dev/root,
                fstype: ext4,
              }
            exp_annotations:
              summary: host inode 사용률이 80%를 넘었습니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
      - eval_time: 25m
        alertname: HostInodeUsageCritical
        exp_alerts: []
      - eval_time: 44m
        alertname: HostInodeUsageHigh
        exp_alerts:
          - exp_labels:
              {
                severity: warning,
                service: host,
                job: host,
                instance: 'alloy:12345',
                env: production,
                mountpoint: /,
                device: /dev/root,
                fstype: ext4,
              }
            exp_annotations:
              summary: host inode 사용률이 80%를 넘었습니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
      - eval_time: 44m
        alertname: HostInodeUsageCritical
        exp_alerts: []
      - eval_time: 45m
        alertname: HostInodeUsageHigh
        exp_alerts: []
      - eval_time: 49m
        alertname: HostInodeUsageCritical
        exp_alerts: []
      - eval_time: 50m
        alertname: HostInodeUsageCritical
        exp_alerts:
          - exp_labels:
              {
                severity: critical,
                service: host,
                job: host,
                instance: 'alloy:12345',
                env: production,
                mountpoint: /,
                device: /dev/root,
                fstype: ext4,
              }
            exp_annotations:
              summary: host inode 사용률이 90%를 넘었습니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
      - eval_time: 50m
        alertname: HostInodeUsageHigh
        exp_alerts: []
      - eval_time: 14m
        alertname: HostMemoryAvailableLow
        exp_alerts: []
      - eval_time: 24m
        alertname: HostMemoryAvailableLow
        exp_alerts: []
      - eval_time: 25m
        alertname: HostMemoryAvailableLow
        exp_alerts:
          - exp_labels:
              {
                severity: critical,
                service: host,
                job: host,
                instance: 'alloy:12345',
                env: production,
              }
            exp_annotations:
              summary: host 사용 가능 memory가 10% 미만입니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
      - eval_time: 50m
        alertname: HostRootFilesystemMetricsMissing
        exp_alerts: []
  # root filesystem 지표가 0분부터 없으면 15분째 평가에서 warning이다(그 전에는 없음).
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="host",instance="alloy:12345",service="host",env="production"}'
        values: '2000x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: HostRootFilesystemMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: HostRootFilesystemMetricsMissing
        exp_alerts:
          - exp_labels: { severity: warning, service: host, job: host, mountpoint: / }
            exp_annotations:
              summary: host root filesystem 지표가 없어 disk·inode 경보가 동작하지 않습니다.
              runbook: infra/runbooks/operations/observability/production-stack.md#경보-대응
