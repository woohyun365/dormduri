# User host 관측 수신 gateway(backoffice-foundation D-BF15, Owner 2026-11-22 Q2·Q5). API 묶음의 `obs-gateway`가 읽는다(관측 설정
# image, /etc/dormduri-gateway/nginx.conf). 관측 stack에 닿는 길을 이 container 하나로 모은다:
# - 9480(host에 publish): 백오피스 host Alloy의 log push(Loki `/loki/api/v1/push`)와 지표 remote write(Prometheus `/api/v1/write`)만
#   받는다. 보낸 주소가 백오피스 host 사설 /32이고 Bearer token이 맞을 때만 넘긴다. 둘은 API 배포 document가 관측 secret 묶음의
#   BACKOFFICE_HOST_PRIVATE_IP·BACKOFFICE_INGEST_TOKEN으로 쓴 include 파일(gateway-access.conf)이 정하고, 두 key가 없으면 모두
#   거부한다. Lightsail 방화벽은 이 port를 열지 않는다(공개 경로 없음, 같은 계정 사설 IP traffic은 방화벽이 거르지 않음).
# - 9482(publish 없음): Prometheus가 API 지표를 긁는 대행 경로. Prometheus를 api-transit에서 빼 API container가 Prometheus에
#   읽기·쓰기 모두 닿지 않게 한다(Q5). 관측 network subnet에서 온 요청만 받는다.
# - 9481(loopback): container healthcheck.
# 접속 log에는 주소·query string·header를 쓰지 않는다.
worker_processes 1;
error_log /dev/stderr alert;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  default_type application/octet-stream;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # $dormduri_backoffice_peer(보낸 주소가 백오피스 host /32면 1)와 $dormduri_backoffice_token(Authorization이 맞으면 1).
  include /run/secrets/dormduri-observability/gateway-access.conf;

  log_format gateway '[$time_local] $server_port "$request_method $uri" $status $request_length $request_time';
  access_log /dev/stdout gateway;

  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_http_version 1.1;

  # docker 내장 DNS. 관측 container가 다시 만들어져도 주소를 다시 찾는다.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 9480;
    server_name _;
    # Alloy batch(log 1 MiB 기본, remote write 수백 KB)를 넘는 본문은 받지 않는다.
    client_max_body_size 4m;

    if ($dormduri_backoffice_peer = 0) {
      return 403;
    }
    if ($dormduri_backoffice_token = 0) {
      return 401;
    }

    location = /loki/api/v1/push {
      limit_except POST {
        deny all;
      }
      set $dormduri_loki http://loki:3100;
      proxy_pass $dormduri_loki;
      proxy_set_header Authorization '';
      proxy_set_header X-Scope-OrgID '';
      proxy_set_header X-Forwarded-For '';
    }

    location = /api/v1/write {
      limit_except POST {
        deny all;
      }
      set $dormduri_prometheus http://prometheus:9090;
      proxy_pass $dormduri_prometheus;
      proxy_set_header Authorization '';
      proxy_set_header X-Forwarded-For '';
    }

    location / {
      return 404;
    }
  }

  server {
    listen 9482;
    server_name _;
    client_max_body_size 1k;
    # 관측 network(infra/deploy/user/api/compose.yml `observability`)만. api-transit의 API·Web은 닿지 않는다.
    allow 10.217.12.0/28;
    deny all;

    location = /internal/metrics {
      limit_except GET {
        deny all;
      }
      # Prometheus가 보낸 API metrics Bearer token을 그대로 넘긴다(API가 확인한다).
      set $dormduri_api http://api:4000;
      proxy_pass $dormduri_api;
      proxy_set_header X-Forwarded-For '';
    }

    location / {
      return 404;
    }
  }

  server {
    listen 127.0.0.1:9481;
    access_log off;
    location = /__gateway/health {
      default_type text/plain;
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }
}
