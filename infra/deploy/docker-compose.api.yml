name: knu-roommate-api

services:
  api:
    build:
      context: ../..
      dockerfile: infra/deploy/api/Dockerfile
    image: knu-roommate-api:${API_IMAGE_TAG:-local}
    env_file:
      - path: ./.env.api
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: ${TZ:-Asia/Seoul}
      OBSERVABILITY_SERVICE_NAME: api
      LOG_PRETTY: 'false'
    expose:
      - '4000'
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', './healthcheck.sh']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - api-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${NGINX_HTTP_BIND:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80'
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    restart: unless-stopped
    networks:
      - api-internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

networks:
  api-internal:
    driver: bridge
