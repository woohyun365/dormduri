# 백오피스 admin ingress(backoffice-foundation D-BF2·D-BF4, infra/deploy/README.md "백오피스 host 묶음").
# 운영자 browser → SSM 포트 포워딩 → host 127.0.0.1:4300 → 이 container 8080 → backoffice-web:3000.
# - Host가 `localhost:4300`과 정확히 같은 요청만 받고 그 밖은 421로 끊는다(DNS rebinding, 다른 이름·주소·port).
# - backoffice-web에는 Host를 port까지 그대로(`$http_host`), Origin·Sec-Fetch-*·Cookie는 받은 그대로 넘긴다. BFF가 이 셋을
#   고정 origin과 정확히 대조하므로(apps/backoffice-web README §3) 바꾸면 상태 변경이 모두 403이다. forwarding header는 비운다.
# - 접속 log에는 IP·query string·referer·user agent를 쓰지 않는다(접속은 SSM agent를 거쳐 늘 host 안에서 온다). error log는 줄마다
#   요청 줄을 붙이므로 alert 이상만 쓴다(user ingress와 같음).
worker_processes 1;
error_log /dev/stderr alert;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  default_type application/octet-stream;
  charset utf-8;
  server_tokens off;

  # read-only root: 임시 경로는 tmpfs /tmp에 둔다.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $request_uri $dormduri_log_path {
    ~^(?<path>[^?]*) $path;
    default -;
  }
  map $http_x_request_id $request_id_or_fallback {
    default $http_x_request_id;
    '' $request_id;
  }
  log_format main '[$time_local] "$request_method $dormduri_log_path $server_protocol" $status $body_bytes_sent '
                  '$request_time "$request_id_or_fallback"';
  access_log /dev/stdout main;

  # Host 대조는 정확한 문자열 하나다(대소문자·끝 점·다른 port 모두 거부). map의 문자열 key는 대소문자를 가리지 않으므로
  # 대소문자를 가리는 정규식(`~`)으로 쓴다.
  map $http_host $backoffice_host_allowed {
    default 0;
    ~^localhost:4300$ 1;
  }

  # BFF 요청 본문은 JSON 몇 KB다(passkey 응답 포함).
  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  # docker 내장 DNS. backoffice-web이 다시 만들어져도 주소를 다시 찾는다.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080 default_server;
    server_name _;

    if ($backoffice_host_allowed = 0) {
      return 421;
    }
    # 화면은 GET·HEAD, BFF는 POST만 쓴다.
    if ($request_method !~ ^(GET|HEAD|POST)$) {
      return 405;
    }

    location / {
      set $backoffice_web http://backoffice-web:3000;
      proxy_pass $backoffice_web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection '';
      proxy_set_header X-Request-Id $request_id_or_fallback;
      proxy_set_header X-Forwarded-For '';
      proxy_set_header X-Forwarded-Host '';
      proxy_set_header X-Forwarded-Proto '';
      proxy_set_header X-Real-IP '';
      proxy_set_header Forwarded '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_hide_header X-Powered-By;
    }
  }

  # container 안 healthcheck 전용(host에 publish하지 않는다).
  server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /__ingress/health {
      default_type text/plain;
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }
}
