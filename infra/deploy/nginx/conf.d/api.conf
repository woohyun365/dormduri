upstream api_upstream {
  server api:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;

  location = /health {
    proxy_pass http://api_upstream/health;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location = /health/live {
    proxy_pass http://api_upstream/health/live;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location = /health/ready {
    proxy_pass http://api_upstream/health/ready;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location = /internal/metrics {
    include /etc/nginx/snippets/internal-metrics-allowlist.conf;
    proxy_pass http://api_upstream/internal/metrics;
    proxy_set_header Authorization $http_authorization;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /api/ {
    proxy_pass http://api_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /auth/ {
    proxy_pass http://api_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /socket.io/ {
    proxy_pass http://api_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location / {
    return 404;
  }
}
