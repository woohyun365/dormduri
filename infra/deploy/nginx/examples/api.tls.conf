# Example only: copy/parameterize this file as nginx/conf.d/api.conf on a host
# that terminates TLS directly. The base compose keeps nginx/conf.d/api.conf as
# a local/proxy-behind-LB HTTP baseline so placeholder cert paths are never
# loaded by default.

upstream api_upstream {
  server api:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name api.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.example.com;

  ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 1m;

  location = /health {
    proxy_pass http://api_upstream/health;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location = /health/live {
    proxy_pass http://api_upstream/health/live;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location = /health/ready {
    proxy_pass http://api_upstream/health/ready;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location = /internal/metrics {
    include /etc/nginx/snippets/internal-metrics-allowlist.conf;
    proxy_pass http://api_upstream/internal/metrics;
    proxy_set_header Authorization $http_authorization;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /api/ {
    proxy_pass http://api_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /auth/ {
    proxy_pass http://api_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /socket.io/ {
    proxy_pass http://api_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location / {
    return 404;
  }
}
