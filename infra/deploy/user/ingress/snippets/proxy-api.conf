# private listener가 API로 보낼 때 쓴다. API container가 없거나(DNS 이름 없음) 응답하지 못하면 JSON 503이다.
# 변수 proxy_pass는 Web이 보낸 요청 URI를 그대로 넘기고, 이름은 요청마다 Docker 내장 DNS로 푼다.
set $api_upstream http://api:4000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id_or_fallback;
# forwarding trust는 꺼져 있다(D-AB1, API `HTTP_TRUST_PROXY_HOPS=0`). 앞 hop이 보낸 client 주소 header를 넘기지 않는다.
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_intercept_errors off;
error_page 502 503 504 = @api_unavailable;
