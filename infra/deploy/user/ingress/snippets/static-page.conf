# 정적 안내 화면 location 공통. 화면은 error_page의 내부 URI로만 닿는다(바깥 요청은 404 → '찾을 수 없음').
# error_page가 URI로 내부 redirect하면 nginx가 GET·HEAD 밖의 method를 GET으로 바꾸므로 POST·PUT도 같은 화면과 status를 받는다.
internal;
root /usr/share/nginx/dormduri;
include /etc/nginx/snippets/headers.conf;
add_header Cache-Control "no-store" always;
# 화면은 파일 안 <style> 하나와 data: 그림만 쓴다. style hash는 네 파일이 같은 <style>의 sha256이고 test가 맞춘다.
add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-sYHuONHlYJq3iFA9hUTR4DL6B0RaoVw5Gxt3zJmHTKA='; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
