# 인증서는 certbot deploy hook이 host `/opt/dormduri/tls`에 nginx group 읽기 권한으로 복사한 사본이다.
ssl_certificate /etc/dormduri-tls/fullchain.pem;
ssl_certificate_key /etc/dormduri-tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# Let's Encrypt는 2025-08-06 OCSP를 끝냈다. ssl_stapling은 두지 않는다.
