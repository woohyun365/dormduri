# 허용 목록 location이 Web으로 보낼 때 쓴다. Web이 없거나 응답하지 못하면(502·504) '일시적 오류' 503이다.
# location에 error_page가 있으면 server의 error_page를 상속하지 않으므로 nginx 자체 500도 여기서 다시 적는다.
error_page 500 /__pages/unavailable.html;
error_page 502 504 =503 /__pages/unavailable.html;

# Web에는 nginx가 허용 목록으로 판정한 정규화 경로($uri)만 보낸다. 원래 URI를 넘기면 `/notices/..%2F`처럼 nginx에서는
# `/`로 풀리는 요청이 Web에서는 열지 않은 page로 해석된다.
proxy_pass $web_upstream$uri$is_args$args;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id_or_fallback;
# Web(Next.js)이 붙이는 실행 환경 header를 바깥에 보이지 않는다.
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
