    <title>돔두리 — 점검 중</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background:
          radial-gradient(48rem 28rem at 50% -8rem, rgb(67 83 255 / 22%), transparent 70%), #0b0d18;
        color: #eceefa;
        font-family:
          'Apple SD Gothic Neo',
          'Malgun Gothic',
          'Noto Sans KR',
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.6;
        word-break: keep-all;
        overflow-wrap: break-word;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      main {
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .mark {
        width: 2.5rem;
        height: 2.5rem;
      }
      .lettering {
        width: auto;
        height: 3rem;
        color: #eceefa;
      }
      .lettering-brand {
        stroke: #a4b0ff;
      }
      .lettering-dot {
        fill: #a4b0ff;
        stroke: none;
      }
      h1 {
        margin: 2.5rem 0 0.75rem;
        font-size: 1.5rem;
        line-height: 1.35;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: #b0b5c9;
      }
      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 2rem;
        padding: 0 1.5rem;
        border-radius: 9999px;
        background: #a4b0ff;
        color: #0b0d18;
        font-weight: 700;
        text-decoration: none;
      }
      .action:focus-visible {
        outline: 2px solid #a4b0ff;
        outline-offset: 2px;
      }
    </style>
