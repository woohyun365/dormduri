# User host ingress(경로 표: infra/deploy/README.md 'User host 묶음'). 허용 목록만 Web으로 보내고, 그 밖은 nginx가 정적 안내
# 화면이나 JSON으로 끝낸다. private listener(8081)는 Web container의 API 요청만 받아 API로 보낸다.

# web·api container가 없을 때(점검 mode, 첫 배포, API 첫 배포 전)도 nginx가 뜨도록 upstream을 변수와 Docker 내장 DNS로 푼다.
resolver 127.0.0.11 valid=10s ipv6=off;

# '일시적 오류' 화면은 Web 무응답(503)과 nginx 자체 오류(500)에 함께 쓴다. Retry-After는 503에만 붙인다.
map $status $dormduri_unavailable_retry_after {
  503 60;
  default '';
}

# 알 수 없는 Host: HTTP는 연결을 닫고, TLS는 handshake를 거절한다.
server {
  listen 8080 default_server;
  server_name _;
  return 444;
}

server {
  listen 8443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

# HTTP: ACME 경로만 응답하고 나머지는 apex HTTPS로 301.
server {
  listen 8080;
  server_name dormduri.com www.dormduri.com;
  add_header X-Robots-Tag "noindex" always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://dormduri.com$request_uri;
  }
}

# www → apex
server {
  listen 8443 ssl;
  http2 on;
  server_name www.dormduri.com;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/headers.conf;
  return 301 https://dormduri.com$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name dormduri.com;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/headers.conf;
  client_max_body_size 1m;

  set $web_upstream http://web:3000;

  # 아래 location이 다시 정하지 않으면 쓰는 화면: 없는 경로 '찾을 수 없음' 404, nginx 자체 500 '일시적 오류',
  # 점검 mode '점검 중' 503.
  error_page 404 /__pages/not-found.html;
  error_page 500 /__pages/unavailable.html;
  error_page 503 /__pages/maintenance.html;

  # 점검 mode: host flag가 있으면 모든 경로가 '점검 중' 503이다. nginx는 내부 redirect에서도 server rewrite를 다시
  # 돌기 때문에, 화면을 내보내는 내부 요청(`/__pages/`)에서는 flag를 보지 않는다. 바깥에서 `/__pages/`를 직접 부르면
  # internal location이 404로 끝낸다.
  set $dormduri_maintenance '';
  if (-f /run/dormduri-mode/maintenance) {
    set $dormduri_maintenance on;
  }
  if ($uri ~ ^/__pages/) {
    set $dormduri_maintenance '';
  }
  if ($dormduri_maintenance) {
    return 503;
  }

  # 허용 목록: Landing·법적 문서·Next.js 정적 파일과 이미지 최적화·metadata 파일.
  location = / { include /etc/nginx/snippets/proxy-web.conf; }
  location = /privacy { include /etc/nginx/snippets/proxy-web.conf; }
  location = /terms { include /etc/nginx/snippets/proxy-web.conf; }
  location ^~ /_next/static/ { include /etc/nginx/snippets/proxy-web.conf; }
  location = /_next/image { include /etc/nginx/snippets/proxy-web.conf; }
  location = /robots.txt { include /etc/nginx/snippets/proxy-web.conf; }
  location = /sitemap.xml { include /etc/nginx/snippets/proxy-web.conf; }
  location = /icon.png { include /etc/nginx/snippets/proxy-web.conf; }

  # 뒤 단계에서 열 경로: '준비 중' 503. 목록은 Web route(apps/web/src/app)와 test가 맞춘다.
  location ~ ^/(?:login|signup|password-reset|main|notifications|support|notices)(?:/|$) {
    error_page 503 /__pages/coming-soon.html;
    return 503;
  }

  # 공개 API 주소는 없다(D-AB1). 브라우저의 `/api/**`는 본문을 읽기 전에 JSON '준비 중' 503으로 끝낸다(#820).
  location ~ ^/api(?:/|$) {
    include /etc/nginx/snippets/headers.conf;
    add_header Retry-After "3600" always;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 503 '{"status":"coming-soon"}';
  }

  # 그 밖의 없는 경로: '찾을 수 없음' 404.
  location / {
    return 404;
  }

  location = /__pages/coming-soon.html {
    include /etc/nginx/snippets/static-page.conf;
    add_header Retry-After "3600" always;
  }

  location = /__pages/maintenance.html {
    include /etc/nginx/snippets/static-page.conf;
    add_header Retry-After "3600" always;
  }

  location = /__pages/unavailable.html {
    include /etc/nginx/snippets/static-page.conf;
    add_header Retry-After $dormduri_unavailable_retry_after always;
  }

  location = /__pages/not-found.html {
    include /etc/nginx/snippets/static-page.conf;
  }

  location ^~ /__pages/ {
    internal;
  }
}

# Web 서버 쪽 API_URL(http://ingress:8081). host에 publish하지 않고, Web container 주소 하나와 container 안 healthcheck(loopback)만
# 받는다. 그 밖의 peer(API transit의 container, Web transit의 다른 주소, gateway)는 403이다. 특정 주소에 listen하지 않는 것은
# network가 기동 뒤에 붙는 경우에도 nginx가 뜨게 하려는 것이다. API container로 보내고, API가 없거나 응답하지 않으면 JSON
# 503이다. `/privacy`·`/terms`는 그 503을 받으면 Web 안 fallback 문서를 보인다.
# Web 주소는 infra/deploy/user/compose.yml의 Web transit 고정 주소와 같다(compose contract·ingress config test가 대조한다).
server {
  listen 8081;
  server_name _;
  allow 10.217.10.2;
  allow 127.0.0.1;
  deny all;
  # container healthcheck 전용(compose). 응답 본문 없음.
  location = /__ingress/health {
    access_log off;
    return 204;
  }
  # API 운영 경로(metrics 등)는 Web에 열지 않는다. Prometheus는 API를 직접 긁는다.
  location ^~ /internal/ {
    default_type application/json;
    return 404 '{"status":"not-found"}';
  }
  location / {
    include /etc/nginx/snippets/proxy-api.conf;
  }
  location @api_unavailable {
    default_type application/json;
    return 503 '{"status":"unavailable"}';
  }
}
