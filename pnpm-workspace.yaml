packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Keep only active parent-boundary exceptions. Remove a selector as soon as its
# owner resolves an equal-or-newer safe version and the closest regression passes.
overrides:
  # Vite (^0.27 || ^0.28) and Storybook (^0.18 ... ^0.28) still admit esbuild
  # lines below 0.28.1 (GHSA-gv7w-rqvm-qjhr), so one root floor keeps every build
  # parent on the patched line; the dependency-health contract checks it. Remove
  # it when every build parent's declared range starts at 0.28.1 or newer.
  esbuild: 0.28.2
  # Next 16.3 and 16.4 pin PostCSS 8.5.23 exactly. One root line keeps that pin
  # and the Tailwind, Vite, Storybook, and Sentry ranges on a single patched
  # PostCSS instead of a Next-only duplicate. Remove it when every build parent
  # resolves 8.5.28+ without it.
  postcss: 8.5.32

catalog:
  '@types/node': 26.6.5
  '@eslint/js': 9.39.5
  '@playwright/test': 1.64.1
  '@sentry/nextjs': 10.76.2
  '@tailwindcss/postcss': 4.3.3
  '@storybook/addon-docs': 10.6.5
  '@storybook/nextjs-vite': 10.6.5
  '@typescript-eslint/eslint-plugin': 8.72.1
  '@typescript-eslint/parser': 8.72.1
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.5
  eslint: 9.39.5
  eslint-config-next: 16.4.3
  eslint-config-prettier: 10.1.8
  next: 16.4.3
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  storybook: 10.6.5
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5

# These exceptions are parent-scoped, dated compatibility contracts rather than
# broad warning suppression. Their owner tests and removal triggers live in
# scripts/dependencies/fixtures/dependency-health-contract.json.
peerDependencyRules:
  allowedVersions:
    '@swc/cli>chokidar': '4'
    'tsconfck>typescript': '6'
