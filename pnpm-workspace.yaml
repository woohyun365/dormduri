packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Keep only active parent-boundary exceptions. Remove a selector as soon as its
# owner resolves an equal-or-newer safe version and the closest regression passes.
overrides:
  # Prisma 7.10.0 still pins the vulnerable deepmerge-ts 7 line in its CLI
  # config graph. Keep this selector parent-scoped until Prisma owns 8.0.2+.
  '@prisma/config>deepmerge-ts': 8.0.2
  # Next 16.3 allows React Hooks lint 7.x, but pnpm otherwise preserves the
  # older transitive lock entry.
  'eslint-config-next>eslint-plugin-react-hooks': 7.1.1
  # Remaining security backports whose current owning parents have not widened
  # their declared ranges yet.
  # NestJS 11.2.3 pins vulnerable Multer 2.2.0 exactly. Keep the patch limited
  # to its Express adapter until a supported NestJS 11 parent owns 2.3.0+.
  '@nestjs/platform-express>multer': 2.3.0
  'engine.io>ws': 8.21.3
  # Every current Vite, Storybook, Nest, Sentry, Webpack, and unplugin parent
  # accepts this fixed line. Revalidate all build owners before changing it.
  esbuild: 0.28.2
  postcss: 8.5.28
  'prisma>mysql2': 3.24.3
  'socket.io-adapter>ws': 8.21.3

catalog:
  '@types/node': 24.13.3
  '@eslint/js': 9.39.5
  '@playwright/test': 1.63.0
  '@sentry/nextjs': 10.73.0
  '@tailwindcss/postcss': 4.3.3
  '@storybook/addon-docs': 10.6.0
  '@storybook/nextjs-vite': 10.6.0
  '@typescript-eslint/eslint-plugin': 8.69.0
  '@typescript-eslint/parser': 8.69.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 5.0.0
  eslint: 9.39.5
  eslint-config-next: 16.3.6
  eslint-config-prettier: 10.1.8
  next: 16.3.6
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  storybook: 10.6.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.69.0
  vite: 8.2.2
  vitest: 5.0.0

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@swc/core'
  - esbuild

# These exceptions are parent-scoped, dated compatibility contracts rather than
# broad warning suppression. Their owner tests and removal triggers live in
# scripts/dependencies/fixtures/dependency-health-contract.json.
peerDependencyRules:
  allowedVersions:
    '@swc/cli>chokidar': '4'
    'tsconfck>typescript': '6'
