packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

catalog:
  '@types/node': 24.13.2
  '@eslint/eslintrc': 3.3.6
  '@eslint/js': 9.39.4
  '@playwright/test': 1.62.1
  '@sentry/nextjs': 10.70.0
  '@tailwindcss/postcss': 4.3.3
  '@storybook/addon-docs': 10.5.7
  '@storybook/nextjs-vite': 10.5.7
  '@typescript-eslint/eslint-plugin': 8.67.0
  '@typescript-eslint/parser': 8.67.0
  '@vitejs/plugin-react': 6.0.5
  '@vitest/coverage-v8': 4.1.10
  eslint: 9.39.4
  eslint-config-next: 16.3.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-prettier: 5.5.6
  next: 16.3.0
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  storybook: 10.5.7
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.67.0
  vite: 8.2.1
  vitest: 4.1.10

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@swc/core'
  - esbuild

# Storybook 10.4.6 transitive vite-tsconfig-paths -> tsconfck@3.1.6 has not
# widened its TypeScript peer metadata for TypeScript 6 yet. Keep this exception
# scoped to tsconfck only; remove it when upstream peer range supports TS 6.
peerDependencyRules:
  allowedVersions:
    'tsconfck>typescript': '6'
