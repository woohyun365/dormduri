packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Keep only active parent-boundary exceptions. Remove a selector as soon as its
# owner resolves an equal-or-newer safe version and the closest regression passes.
overrides:
  # Next 16.3 allows React Hooks lint 7.x, but pnpm otherwise preserves the
  # older transitive lock entry.
  'eslint-config-next>eslint-plugin-react-hooks': 7.1.1
  # Remaining security backports whose current owning parents have not widened
  # their declared ranges yet.
  'engine.io>ws': 8.21.3
  postcss: 8.5.26
  'prisma>mysql2': 3.23.1
  'socket.io-adapter>ws': 8.21.3

catalog:
  '@types/node': 24.13.3
  '@eslint/js': 9.39.5
  '@playwright/test': 1.62.1
  '@sentry/nextjs': 10.69.0
  '@tailwindcss/postcss': 4.3.1
  '@storybook/addon-docs': 10.5.10
  '@storybook/nextjs-vite': 10.5.10
  '@typescript-eslint/eslint-plugin': 8.69.0
  '@typescript-eslint/parser': 8.69.0
  '@vitejs/plugin-react': 6.1.0
  '@vitest/coverage-v8': 5.0.0
  eslint: 9.39.5
  eslint-config-next: 16.3.0
  eslint-config-prettier: 10.1.8
  next: 16.3.0
  prettier: 3.9.6
  react: 19.2.7
  react-dom: 19.2.7
  storybook: 10.5.10
  tailwindcss: 4.3.1
  typescript: 6.0.3
  typescript-eslint: 8.69.0
  vite: 8.2.2
  vitest: 5.0.0

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@swc/core'
  - esbuild

# Storybook 10.4.6 transitive vite-tsconfig-paths -> tsconfck@3.1.6 has not
# widened its TypeScript peer metadata for TypeScript 6 yet. Keep this exception
# scoped to tsconfck only; remove it when upstream peer range supports TS 6.
peerDependencyRules:
  allowedVersions:
    'tsconfck>typescript': '6'
