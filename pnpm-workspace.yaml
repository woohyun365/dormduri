packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Next 16.3 allows React Hooks lint 7.x, but pnpm preserves the older
# transitive lock entry unless this owner boundary is explicit.
overrides:
  'eslint-config-next>eslint-plugin-react-hooks': 7.1.1
  # Security backports for runtime transitives whose current owning parents
  # have not widened their ranges yet. Remove each selector after the parent
  # resolves the same or newer safe version and full API regression passes.
  '@nestjs/platform-express>multer': 2.2.0
  'engine.io>ws': 8.21.3
  'express>body-parser': 2.3.0
  'socket.io-adapter>ws': 8.21.3
  'socket.io>socket.io-parser': 4.2.7
  qs: 6.15.2

catalog:
  '@types/node': 24.13.2
  '@eslint/eslintrc': 3.3.5
  '@eslint/js': 9.39.4
  '@playwright/test': 1.62.1
  '@sentry/nextjs': 10.69.0
  '@tailwindcss/postcss': 4.3.1
  '@storybook/addon-docs': 10.5.10
  '@storybook/nextjs-vite': 10.5.10
  '@typescript-eslint/eslint-plugin': 8.67.0
  '@typescript-eslint/parser': 8.67.0
  '@vitejs/plugin-react': 6.1.0
  '@vitest/coverage-v8': 4.1.11
  eslint: 9.39.4
  eslint-config-next: 16.3.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-prettier: 5.5.6
  next: 16.3.0
  prettier: 3.8.4
  react: 19.2.7
  react-dom: 19.2.7
  storybook: 10.5.10
  tailwindcss: 4.3.1
  typescript: 6.0.3
  typescript-eslint: 8.67.0
  vite: 8.2.2
  vitest: 4.1.11

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@swc/core'
  - esbuild

# Storybook 10.4.6 transitive vite-tsconfig-paths -> tsconfck@3.1.6 has not
# widened its TypeScript peer metadata for TypeScript 6 yet. Keep this exception
# scoped to tsconfck only; remove it when upstream peer range supports TS 6.
peerDependencyRules:
  allowedVersions:
    'tsconfck>typescript': '6'
